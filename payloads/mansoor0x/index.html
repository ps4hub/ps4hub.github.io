<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mansoor0x</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #000;
    color: #c0c0c0;
    font: 400 14px/1.7 "Courier New", Courier, monospace;
    padding: 32px 28px;
    min-height: 100vh;
}

#title {
    font-size: 13px;
    color: #fff;
    letter-spacing: .06em;
    margin-bottom: 2px;
}

#sub {
    font-size: 11px;
    color: #555;
    margin-bottom: 28px;
}

.row {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
    font-size: 12px;
}

.k { color: #555; width: 80px; flex-shrink: 0; }
.v { color: #c0c0c0; }
.v.ok  { color: #6af; }
.v.err { color: #f66; }
.v.dim { color: #444; }

#sep {
    border: none;
    border-top: 1px solid #1a1a1a;
    margin: 18px 0;
}

#note {
    font-size: 11px;
    color: #444;
    margin-top: 20px;
    line-height: 1.9;
}

a { color: #555; text-decoration: none; }
a:hover { color: #888; }
</style>
</head>
<body>

<div id="title">mansoor0x / ps4 userland</div>
<div id="sub">polpNO · webkit exploit · 9.00 – 13.52</div>

<div class="row"><span class="k">firmware</span><span class="v" id="v-fw">detecting…</span></div>
<div class="row"><span class="k">chain</span>   <span class="v" id="v-ch">—</span></div>
<div class="row"><span class="k">offsets</span> <span class="v" id="v-off">—</span></div>
<div class="row"><span class="k">status</span>  <span class="v" id="v-st">—</span></div>

<hr id="sep">

<div id="note" id="v-note"></div>

<script type="module">
import { offsetsFor } from "./ps4_offsets.mjs";

const $ = id => document.getElementById(id);
function set(id, txt, cls) {
    const e = $(id); if (!e) return;
    e.textContent = txt;
    e.className = "v" + (cls ? " " + cls : "");
}

const ua  = navigator.userAgent;
const isPS4 = ua.includes("PlayStation 4");

if (!isPS4) {
    set("v-fw",  "not a PS4", "err");
    set("v-st",  "open on PS4 browser", "err");
} else {
    const { key, off } = offsetsFor(ua);
    set("v-fw", key || "unknown", key ? "ok" : "err");

    if (!key || !off) {
        set("v-ch",  "none", "err");
        set("v-off", "no offsets", "err");
        set("v-st",  "unsupported firmware", "err");
        $("v-note").textContent = "supported: 9.00 – 13.52";
    } else {
        const fw_n = parseInt(key.split(".")[0]) * 100 + parseInt(key.split(".")[1]);
        const chain = fw_n <= 1202 ? "lapse" : "poops";
        const target = chain === "lapse" ? "lapse.html" : "poops.html";

        set("v-ch",  chain, "ok");
        set("v-off", off.fw_status
            ? off.fw_status.split(" ")[0].replace("state=","")
            : "loaded", "ok");
        set("v-st",  "redirecting…", "ok");

        const n = $("v-note");
        n.textContent = key + " → " + target;

        setTimeout(() => { location.href = target; }, 600);
    }
}
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
