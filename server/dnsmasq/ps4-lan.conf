# PS4 isolated LAN DHCP config — eth0 (10.1.1.0/24), no internet on this segment
# Managed manually (dnsmasq has no DietPi-Software catalog entry); check with:
#   systemctl status dnsmasq
#   cat /etc/dnsmasq.d/ps4-lan.conf

interface=eth0
bind-interfaces
except-interface=wlan0

# Only serve DHCP/DNS on eth0 — never touch the WiFi/main-LAN interface
no-dhcp-interface=wlan0

domain-needed
bogus-priv

# Pool starts at .2 as requested. Once the PS4's MAC is known, add a
# reservation so it ALWAYS gets .2 specifically (dnsmasq honors this even
# though .2 is also inside the general pool range below):
#   dhcp-host=AA:BB:CC:DD:EE:FF,10.1.1.2,ps4
dhcp-range=10.1.1.2,10.1.1.200,255.255.255.0,12h

# Gateway handed out is this Pi itself — harmless since ip_forward=0 and no
# NAT/iptables exist on this box, so it's a dead end, not a real route out
# Gateway/DNS only for the PS4 (tag ps4); other clients (e.g. the PC) get an
# address only, so they keep using their own WiFi route/DNS
dhcp-host=c8:63:f1:74:63:0f,10.1.1.10,ps4,set:ps4
dhcp-option=tag:ps4,3,10.1.1.1
dhcp-option=tag:ps4,6,10.1.1.1
dhcp-option=tag:!ps4,3
dhcp-option=tag:!ps4,6

# DNS ON (2026-10-03): every name resolves to this Pi, so the PS4 User s Guide
# (manuals.playstation.net) loads the hub. no-resolv = nothing forwarded upstream.
no-resolv
address=/#/10.1.1.1
log-queries
